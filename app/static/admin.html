<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="{{BASE}}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="static/icon-192.png">
<link rel="stylesheet" href="static/style.css?v={{VERSION}}">
<link rel="stylesheet" href="static/admin.css?v={{VERSION}}">
<title>SD Ops Admin</title>
</head>
<body>
<header class="bar">
  <img src="static/logo.png" alt="SimplyDoors" class="bar-logo">
  <div class="bar-right"><span id="who"></span><a class="link" href="./">Staff app</a></div>
</header>
<main class="admin">
  <div id="gate" class="hidden"><h1>Admins only</h1><p>Sign in on the <a href="./">staff app</a> first, then come back here.</p></div>
  <div id="ui" class="hidden">
    <nav class="tabs" role="tablist">
      <button data-tab="reports" class="active">Reports</button>
      <button data-tab="log">Activity log</button>
      <button data-tab="staff">Staff &amp; PINs</button>
      <button data-tab="rules">Email lists</button>
      <button data-tab="status">Status</button>
    </nav>

    <section data-panel="reports">
      <div class="filters">
        <input id="repQ" type="search" placeholder="Search receipt, name, PO, customer…">
        <select id="repForm"><option value="">All forms</option></select>
      </div>
      <div id="repList"></div>
    </section>

    <section data-panel="log" class="hidden">
      <p class="muted small">Every sign-in, report, email, view and change. Entries can't be edited or deleted, by anyone.</p>
      <div class="filters">
        <input id="logPerson" type="search" placeholder="Person">
        <select id="logAction"><option value="">Everything</option></select>
        <label class="datebox">From<input id="logFrom" type="date"></label>
        <label class="datebox">To<input id="logTo" type="date"></label>
        <button class="mini" id="logCsv" type="button">Export spreadsheet</button>
      </div>
      <div id="logCount" class="muted small"></div>
      <div id="logList"></div>
      <button class="mini" id="logMore" type="button">Load older</button>
    </section>

    <section data-panel="staff" class="hidden">
      <div id="staffList"></div>
      <details class="addbox"><summary>Add a person</summary>
        <form id="addStaff" class="grid">
          <label>Name<input name="name" required></label>
          <label>Department<input name="dept" list="depts" required></label>
          <label>Work email<input name="email" type="email"></label>
          <label class="inline"><input name="sales_notify" type="checkbox"> Shows in "Notify a sales rep"</label>
          <label class="inline"><input name="is_admin" type="checkbox"> Admin (sees everything)</label>
          <button class="mini primary" type="submit">Add</button>
        </form>
      </details>
      <datalist id="depts"></datalist>
    </section>

    <section data-panel="rules" class="hidden">
      <p class="muted small">Who gets emailed for each report. Separate addresses with commas.</p>
      <div id="rulesList"></div>
    </section>

    <section data-panel="status" class="hidden"><div id="statusBox"></div></section>
  </div>
</main>

<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-box"><button class="sheet-close" type="button" aria-label="Close">×</button><div id="sheetBody"></div></div>
</div>
<script src="static/admin.js?v={{VERSION}}"></script>
</body>
</html>
